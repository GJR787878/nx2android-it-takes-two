# Builds the phone app (the APK) on GitHub: the payload (the rootfs the phone runs the tools with), the build
# tools, the app's assets and the APK itself (packaging/android-apk/build_apk.sh). This fork is the CI-buildable
# copy of GJR787878/nx2android-it-takes-two.
#
# workflow_dispatch builds the branch and keeps the APK as the run's artifact. A v* tag additionally attaches the
# APK to the release with that tag, when the release already exists.
#
# The release variant uses the project key from NX2A_KEYSTORE_B64 when the secret is set; otherwise it falls back
# to the runner's throwaway debug key (a build for inspection, not an update over an earlier install). The
# password/alias secrets let the same debug keystore used by the local alpha builds be restored here.
name: Android app

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "release (signed) or debug"
        required: true
        default: release
        type: choice
        options: [release, debug]
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NX2A_KEYSTORE_PASSWORD: ${{ secrets.NX2A_KEYSTORE_PASSWORD }}
      NX2A_KEYSTORE_ALIAS: ${{ secrets.NX2A_KEYSTORE_ALIAS }}
      NX2A_KEY_PASSWORD: ${{ secrets.NX2A_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # the Python the build scripts run on; the payload's own Python is 3.13
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'       # the Android Gradle plugin's Java
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # the extractor and the shader translator are C#
      - name: the SDK parts the build needs
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.3.13750724"
          yes | sdkmanager --licenses > /dev/null
      # the payload and the build tools do not depend on the repository: they are fetched once and kept
      - uses: actions/cache@v4
        with:
          path: |
            packaging/android-apk/.cache/payload-arm64.tar.gz
            packaging/android-apk/.cache/toolchain
            packaging/android-apk/.cache/debs
            packaging/android-apk/.cache/nuget
            packaging/android-apk/.cache/pylibs
            packaging/android-apk/.cache/Turnip_Gen8_V39.zip
            packaging/android-apk/.cache/dotnet
          key: nx2a-android-payload-v2
      - name: the app's signing key
        run: |
          # A release is signed with the project's own key: it must be the key every earlier build was signed
          # with, or a phone that installed one can never install this one over it. Without the secret the
          # build falls back to the runner's throwaway debug key - fine for a look, useless for a player.
          if [ -n "$NX2A_KEYSTORE_B64" ]; then
            echo "$NX2A_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nx2android.keystore"
            echo "NX2A_KEYSTORE=$RUNNER_TEMP/nx2android.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::the secret NX2A_KEYSTORE_B64 is missing: the APK carries the runner's debug key and cannot be installed over an earlier one"
          fi
        env:
          NX2A_KEYSTORE_B64: ${{ secrets.NX2A_KEYSTORE_B64 }}
      - name: Build the APK
        env:
          GH_TOKEN: ${{ github.token }}   # the payload release is public
        run: |
          variant='${{ inputs.variant }}'
          [ -n "$variant" ] || variant=release
          echo "VARIANT=$variant" >> "$GITHUB_ENV"
          export DOTNET="$(command -v dotnet)"
          bash packaging/android-apk/build_apk.sh "$variant"
      - name: the game profiles package
        # The app does not carry the half-gigabyte of shader tables: the player imports a package into their own
        # folder. The build cuts the package beside the assets; this step only reports it.
        run: ls -la packaging/android-apk/.cache/profiles/
      - uses: actions/upload-artifact@v4
        with:
          name: nx2a-game-profiles
          path: packaging/android-apk/.cache/profiles/*.zip
          retention-days: 14
          if-no-files-found: warn
      - name: the APK's name
        id: apk
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            ver="${{ github.ref_name }}"
          else
            ver="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)"
          fi
          echo "name=nx2android-${ver}.apk" >> "$GITHUB_OUTPUT"
          echo "name: nx2android-${ver}.apk"
      - name: the APK
        run: ls -la "android/app/build/outputs/apk/${VARIANT}"/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nx2android-android-apk
          path: android/app/build/outputs/apk/${{ env.VARIANT }}/*.apk
          retention-days: 14
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          # The release is made right after the tag is pushed, so it may not be there yet: wait for it, then
          # attach the APK to it. A release that never shows up leaves the APK in the run's artifact.
          for i in $(seq 1 36); do
            if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::warning::the release ${{ github.ref_name }} is not there yet: the APK stays as this run's artifact"
            exit 0
          fi
          apk=$(ls -t "android/app/build/outputs/apk/${VARIANT}"/*.apk | head -1)
          cp "$apk" "android/app/build/outputs/apk/${VARIANT}/${{ steps.apk.outputs.name }}"
          gh release upload "${{ github.ref_name }}" "android/app/build/outputs/apk/${VARIANT}/${{ steps.apk.outputs.name }}" --clobber
          for zip in packaging/android-apk/.cache/profiles/*.zip; do
            [ -f "$zip" ] && gh release upload "${{ github.ref_name }}" "$zip" --clobber
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - if: startsWith(github.ref, 'refs/tags/')
        name: the QQ group's announcement
        # The announcement is an extra: a refused token, a group that took the bot out, a link the platform
        # refuses - none of it may fail the release's build.
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python devtools/qq_release_announce.py announce --tag "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
          QQBOT_APP_ID: ${{ secrets.QQBOT_APP_ID }}
          QQBOT_APP_SECRET: ${{ secrets.QQBOT_APP_SECRET }}
          QQBOT_GROUP_OPENID: ${{ secrets.QQBOT_GROUP_OPENID }}
